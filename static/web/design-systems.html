<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Systems Library — 150 Brand Design Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090e;
  --bg2:#0f0f18;
  --bg3:#14141f;
  --surface:#1a1a28;
  --surface2:#20202e;
  --border:#252535;
  --border2:#2e2e42;
  --text:#e8e8f0;
  --text2:#9898b0;
  --text3:#5c5c78;
  --accent:#6d6aff;
  --accent2:#a5a3ff;
  --accent-glow:rgba(109,106,255,0.15);
  --green:#22c55e;
  --font:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HEADER */
.site-header{position:sticky;top:0;z-index:100;background:rgba(9,9,14,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;gap:16px;height:60px;padding:0 24px}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--text);white-space:nowrap;text-decoration:none}
.logo-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#6d6aff,#a855f7);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:16px;height:16px;color:#fff}
.logo-badge{display:inline-flex;align-items:center;background:rgba(109,106,255,0.12);border:1px solid rgba(109,106,255,0.3);color:var(--accent2);font-size:11px;font-weight:500;padding:1px 7px;border-radius:20px;margin-left:2px}
.search-wrap{flex:1;max-width:440px;position:relative}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none;flex-shrink:0}
#search{width:100%;height:38px;background:var(--surface);border:1px solid var(--border2);border-radius:9px;padding:0 12px 0 38px;font-family:var(--font);font-size:13.5px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
#search::placeholder{color:var(--text3)}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.header-stat{font-size:12px;color:var(--text3);margin-left:auto;white-space:nowrap;padding:4px 12px;background:var(--surface);border:1px solid var(--border);border-radius:20px}

/* HERO */
.hero{text-align:center;padding:60px 24px 44px;position:relative;overflow:hidden}
.hero-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 700px 320px at 50% -20%,rgba(109,106,255,0.09),transparent 70%)}
.hero-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--accent2);border:1px solid var(--border2);border-radius:20px;padding:5px 14px;margin-bottom:22px;background:rgba(109,106,255,0.06);letter-spacing:0.01em}
.hero-label span{width:6px;height:6px;background:var(--green);border-radius:50%;display:inline-block}
.hero h1{font-size:clamp(30px,5vw,54px);font-weight:700;line-height:1.1;letter-spacing:-0.025em;background:linear-gradient(160deg,#e8e8f0 30%,#6d6aff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:16px}
.hero-desc{font-size:16px;color:var(--text2);max-width:520px;margin:0 auto 0;line-height:1.65}

/* FILTER BAR */
.filter-wrap{max-width:1400px;margin:0 auto;padding:32px 24px 20px}
.filter-scroll{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.filter-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--font)}
.filter-btn:hover{border-color:var(--border2);background:var(--surface2);color:var(--text)}
.filter-btn.active{background:var(--accent-glow);border-color:rgba(109,106,255,0.4);color:var(--accent2)}
.filter-cnt{font-size:11px;background:var(--bg3);padding:1px 6px;border-radius:10px;color:var(--text3)}
.filter-btn.active .filter-cnt{background:rgba(109,106,255,0.18);color:var(--accent2)}
.filter-sep{width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 2px}

/* GRID */
.grid-section{max-width:1400px;margin:0 auto;padding:0 24px 80px}
.result-line{font-size:13px;color:var(--text3);margin-bottom:14px}
.result-line em{color:var(--text2);font-style:normal;font-weight:500}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 0 1px rgba(109,106,255,0.08);background:var(--surface2)}
.card-top{display:flex;align-items:center;gap:12px}
.co-logo{width:38px;height:38px;border-radius:9px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.co-logo img{width:24px;height:24px;object-fit:contain;display:block}
.co-initials{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:-0.5px;display:none}
.card-info{flex:1;min-width:0}
.card-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;margin-bottom:3px}
.cat-pill{display:inline-block;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:5px}
.c-DevTools{background:rgba(99,102,241,.14);color:#a5b4fc}
.c-AITech{background:rgba(168,85,247,.14);color:#d8b4fe}
.c-Creative{background:rgba(236,72,153,.14);color:#f9a8d4}
.c-SaaS{background:rgba(6,182,212,.14);color:#67e8f9}
.c-Finance{background:rgba(34,197,94,.14);color:#86efac}
.c-Commerce{background:rgba(245,158,11,.14);color:#fcd34d}
.c-Social{background:rgba(59,130,246,.14);color:#93c5fd}
.c-Gaming{background:rgba(239,68,68,.14);color:#fca5a5}
.c-Media{background:rgba(20,184,166,.14);color:#5eead4}
.c-Education{background:rgba(234,179,8,.14);color:#fef08a}
.card-colors{display:flex;gap:4px}
.cdot{width:20px;height:20px;border-radius:5px;border:1px solid rgba(255,255,255,.07);flex-shrink:0;transition:transform .15s}
.card:hover .cdot{transform:scale(1.12)}
.card-tagline{font-size:12.5px;color:var(--text2);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.card-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.card-domain{font-size:11px;color:var(--text3);font-family:var(--mono)}
.card-arrow{color:var(--accent2);opacity:0;transition:opacity .15s,transform .15s;display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:500}
.card:hover .card-arrow{opacity:1;transform:translateX(2px)}

/* EMPTY */
.empty-state{grid-column:1/-1;text-align:center;padding:80px 24px;color:var(--text3)}
.empty-state svg{opacity:.25;margin-bottom:16px}
.empty-state p{font-size:14px}

/* DRAWER */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:all}
.drawer{position:fixed;right:0;top:0;bottom:0;z-index:201;width:min(700px,95vw);background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.25,.46,.45,.94);box-shadow:-20px 0 60px rgba(0,0,0,.6)}
.drawer.open{transform:translateX(0)}
.d-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.d-logo{width:42px;height:42px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.d-logo img{width:28px;height:28px;object-fit:contain;display:block}
.d-logo .co-initials{display:none}
.d-meta{flex:1;min-width:0}
.d-name{font-size:17px;font-weight:600;color:var(--text);margin-bottom:5px}
.d-swatches{display:flex;gap:4px}
.d-swatch{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.1)}
.d-actions{display:flex;gap:6px;margin-left:auto}
.ibt{width:34px;height:34px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;color:var(--text2)}
.ibt:hover{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.ibt.ok{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.35);color:var(--green)}
.d-body{flex:1;overflow-y:auto;padding:28px 30px}

/* MD */
.md h1{font-size:24px;font-weight:700;color:var(--text);margin-bottom:6px;letter-spacing:-0.02em}
.md blockquote{border-left:3px solid var(--accent);padding:10px 14px;background:rgba(109,106,255,0.08);border-radius:0 8px 8px 0;margin:0 0 22px;color:var(--text2);font-size:13.5px;line-height:1.6}
.md blockquote p{margin:0}
.md h2{font-size:15px;font-weight:600;color:var(--text);margin:28px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border);letter-spacing:-0.01em}
.md h3{font-size:13.5px;font-weight:600;color:var(--text2);margin:16px 0 7px}
.md p{font-size:13.5px;color:var(--text2);line-height:1.7;margin-bottom:10px}
.md ul,.md ol{padding-left:18px;margin-bottom:10px}
.md li{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:3px}
.md table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12.5px}
.md th{background:var(--surface);color:var(--text2);font-weight:600;padding:7px 10px;text-align:left;border:1px solid var(--border)}
.md td{padding:6px 10px;border:1px solid var(--border);color:var(--text2)}
.md td:first-child{color:var(--text);font-family:var(--mono);font-size:11.5px}
.md tr:nth-child(even) td{background:var(--bg3)}
.md code{font-family:var(--mono);font-size:12px;background:var(--bg3);border:1px solid var(--border);padding:1px 5px;border-radius:4px;color:#a5b4fc}
.md pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;overflow-x:auto}
.md pre code{background:none;border:none;padding:0;font-size:12px;color:#a5b4fc;display:block}
.md hr{border:none;border-top:1px solid var(--border);margin:20px 0}
.md strong{color:var(--text);font-weight:600}
.md a{color:var(--accent2);text-decoration:none}
.md a:hover{text-decoration:underline}

/* SCROLLBAR */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* RESPONSIVE */
@media(max-width:640px){
  .hero{padding:36px 16px 28px}
  .hero h1{font-size:26px}
  .filter-wrap,.grid-section{padding-left:16px;padding-right:16px}
  .cards-grid{grid-template-columns:1fr}
  .header-stat{display:none}
}
</style>
</head>

const CATS = [
  {k:'Dev Tools',css:'DevTools'},{k:'AI & Tech',css:'AITech'},{k:'SaaS',css:'SaaS'},
  {k:'Finance',css:'Finance'},{k:'Commerce',css:'Commerce'},{k:'Creative',css:'Creative'},
  {k:'Social',css:'Social'},{k:'Gaming',css:'Gaming'},{k:'Media',css:'Media'},{k:'Education',css:'Education'}
];

const catCounts = {};
DATA.forEach(d => { catCounts[d.category] = (catCounts[d.category]||0)+1; });

function catCss(cat) { const m={};CATS.forEach(c=>m[c.k]=c.css);return m[cat]||'SaaS'; }

// Build filter buttons
const filterBar = document.getElementById('filter-bar');
CATS.forEach(({k,css}) => {
  if (!catCounts[k]) return;
  const btn = document.createElement('button');
  btn.className = 'filter-btn';
  btn.dataset.cat = k;
  btn.innerHTML = k + ' <span class="filter-cnt">' + catCounts[k] + '</span>';
  filterBar.appendChild(btn);
});

let activeFilter = 'all';
let searchQuery = '';
let currentId = null;

function logoImg(domain, name, size) {
  const init = name.replace(/[^A-Za-z0-9]/g,'').substring(0,2).toUpperCase();
  return `<img src="https://logo.clearbit.com/${domain}?size=56" alt="${name}"
    onload="this.style.display='block';this.nextSibling.style.display='none'"
    onerror="this.style.display='none';this.nextSibling.style.display='flex'"
    style="width:${size}px;height:${size}px;object-fit:contain;display:block">
  <span class="co-initials" style="display:none">${init}</span>`;
}

function renderCards(items) {
  const grid = document.getElementById('cards-grid');
  const rl = document.getElementById('result-line');
  rl.innerHTML = 'Showing <em>' + items.length + '</em> design system' + (items.length !== 1 ? 's' : '');

  if (!items.length) {
    grid.innerHTML = '<div class="empty-state"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6M11 8v6"/></svg><p>No results for "<em>' + searchQuery + '</em>"</p></div>';
    return;
  }

  grid.innerHTML = items.map(d => {
    const dots = d.colors.slice(0,5).map(c =>
      `<div class="cdot" style="background:${c}" title="${c}"></div>`
    ).join('');
    const tag = d.tagline || '';
    const css = catCss(d.category);
    return `<div class="card" data-id="${d.id}" onclick="openDrawer('${d.id}')">
      <div class="card-top">
        <div class="co-logo">${logoImg(d.domain, d.name, 24)}</div>
        <div class="card-info">
          <div class="card-name">${d.name}</div>
          <span class="cat-pill c-${css}">${d.category}</span>
        </div>
      </div>
      <div class="card-colors">${dots}</div>
      <div class="card-tagline">${tag}</div>
      <div class="card-bottom">
        <span class="card-domain">${d.domain}</span>
        <span class="card-arrow">View <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
      </div>
    </div>`;
  }).join('');
}

function applyFilters() {
  const q = searchQuery.toLowerCase();
  const filtered = DATA.filter(d => {
    const catOk = activeFilter === 'all' || d.category === activeFilter;
    const qOk = !q || d.name.toLowerCase().includes(q) || d.tagline.toLowerCase().includes(q) || d.id.includes(q) || d.domain.includes(q) || d.category.toLowerCase().includes(q);
    return catOk && qOk;
  });
  renderCards(filtered);
}

filterBar.addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.cat;
  applyFilters();
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  applyFilters();
});

// Drawer
const overlay = document.getElementById('overlay');
const drawer = document.getElementById('drawer');

async function openDrawer(id) {
  const d = DATA.find(x => x.id === id);
  if (!d) return;
  currentId = id;

  document.getElementById('d-name').textContent = d.name;
  document.getElementById('d-logo').innerHTML = logoImg(d.domain, d.name, 28);
  document.getElementById('d-swatches').innerHTML = d.colors.slice(0,5).map(c =>
    `<div class="d-swatch" style="background:${c}" title="${c}"></div>`
  ).join('');

  overlay.classList.add('open');
  drawer.classList.add('open');
  document.body.style.overflow = 'hidden';

  const mc = document.getElementById('md-content');
  mc.innerHTML = '<p style="color:var(--text3);font-size:13px;padding:20px 0">Loading...</p>';

  try {
    const r = await fetch('design-ai-main/design-md/' + id + '/DESIGN.md');
    const txt = await r.text();
    mc.innerHTML = marked.parse(txt);
  } catch(e) {
    mc.innerHTML = '<p style="color:var(--text3);font-size:13px">Failed to load.</p>';
  }
  drawer.querySelector('.d-body').scrollTop = 0;
}

function closeDrawer() {
  overlay.classList.remove('open');
  drawer.classList.remove('open');
  document.body.style.overflow = '';
  currentId = null;
}

overlay.addEventListener('click', closeDrawer);
document.getElementById('close-btn').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

document.getElementById('copy-btn').addEventListener('click', () => {
  if (!currentId) return;
  const path = 'design-ai-main/design-md/' + currentId + '/DESIGN.md';
  navigator.clipboard.writeText(path).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('ok');
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>';
    setTimeout(() => {
      btn.classList.remove('ok');
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    }, 2000);
  });
});

applyFilters();
</script>
