<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锚点定位演示</title>
    <style>
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            padding: 8px 15px;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .nav a:hover {
            background-color: #555;
        }

        .content {
            margin-top: 70px;
        }

        .box {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="#box1">盒子1</a>
        <a href="#box2">盒子2</a>
        <a href="#box3">盒子3</a>
        <a href="#box4">盒子4</a>
        <a href="#box5">盒子5</a>
    </nav>

    <div class="content">
        <div id="box1" class="box">盒子1</div>
        <div id="box2" class="box">盒子2</div>
        <div id="box3" class="box">盒子3</div>
        <div id="box4" class="box">盒子4</div>
        <div id="box5" class="box">盒子5</div>
    </div>
</body>
</html>
